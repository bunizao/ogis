<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The default OGIS card in miniature: night sky, one star, "OG" as the pixel title. Pixels sit on a 2-unit grid. -->
  <defs>
    <radialGradient id="sky" cx="23" cy="9" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26315c"/>
      <stop offset=".45" stop-color="#0d1226"/>
      <stop offset="1" stop-color="#05060c"/>
    </radialGradient>
    <radialGradient id="glow" cx="23" cy="9" r="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#sky)"/>
  <circle cx="23" cy="9" r="8" fill="url(#glow)"/>
  <g fill="#fff" shape-rendering="crispEdges">
    <path opacity=".4" d="M6 6h2v2h-2zM10 12h2v2h-2zM28 14h2v2h-2z"/>
    <path opacity=".6" d="M22 4h2v2h-2zM18 8h2v2h-2zM26 8h2v2h-2zM22 12h2v2h-2z"/>
