name: Test

# Runs on a fresh checkout, so a font or image that a theme reads from public/
# but that was never committed fails here even when it exists on a laptop.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reads packageManager (bun@1.4.2), the same version the Dockerfile pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun test
